# This is a Databricks asset bundle definition for lakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakehouse_analytics
  uuid: e940a653-83be-4bde-b8a2-4aef050675e5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    presets:
    name: dev_${}

    workspace:
      host: https://dbc-aab5aa5a-ee27.cloud.databricks.com
    variables:
      catalog: ecommerce_dev
      schema: dev
      
  prod:
    mode: production
    workspace:
      host: https://dbc-aab5aa5a-ee27.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/borge.pambo71@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/borge.pambo71@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ecommerce_dev
      schema: prod
    permissions:
      - user_name: borge.pambo71@gmail.com
        level: CAN_MANAGE




